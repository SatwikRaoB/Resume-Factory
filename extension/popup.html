<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }

        .header {
            background-color: #ffffff;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: #111827;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background-color: #2563eb;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-online {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-offline {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .container {
            padding: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 4px;
        }

        textarea,
        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            background-color: #111827;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: #000;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            min-height: 16px;
        }

        .text-success {
            color: #166534;
        }

        .text-error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">RT</div>
            <span>Resume Tailor</span>
        </div>
        <div id="connectionStatus" class="status-badge status-offline">Offline</div>
    </div>

    <div class="container">
        <label>Job Description</label>
        <textarea id="jdInput" placeholder="Paste full job description here..."></textarea>

        <label>Target Filename (Optional)</label>
        <input type="text" id="filenameInput" placeholder="e.g. Google_Senior_Dev">

        <button id="sendBtn">
            <span>Add to Queue</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </button>

        <div id="message"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
