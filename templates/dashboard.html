<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Tailor AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script>
            (function () {
                const userTheme = localStorage.getItem('theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (userTheme === 'dark' || (!userTheme && systemDark)) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.removeAttribute('data-theme');
                }
            })();
    </script>
    <!-- FIXED: Removed markdown formatting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- PDF.js Library -->
    <!-- FIXED: Removed markdown formatting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        window.onload = function () {
            if (typeof pdfjsLib !== 'undefined') {
                // FIXED: Removed markdown formatting
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }
        };
    </script>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <nav class="bg-white border-b border-gray-200 z-30 shadow-sm flex-none dark:bg-slate-800 dark:border-slate-700">
        <div class="container mx-auto px-8 py-3 flex justify-between items-center max-w-6xl">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded shadow-sm">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-gray-900 dark:text-white">Resume Tailor</h1>
                    <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider -mt-1">Automated Workflow
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()"
                    class="text-gray-400 hover:text-yellow-500 transition p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700"
                    title="Toggle Dark Mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>

                <div
                    class="flex items-center gap-2 bg-gray-50 dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-slate-600">
                    <span class="text-gray-500 dark:text-gray-300 text-xs font-bold uppercase tracking-wide"><i
                            class="fas fa-layer-group mr-1"></i> Batch</span>
                    <select id="concurrencySelector" onchange="updateConcurrency()"
                        class="bg-transparent font-bold text-sm focus:outline-none cursor-pointer text-gray-700 dark:text-gray-200 dark:bg-slate-700">
                        <option value="1" class="dark:bg-slate-800">1 Job</option>
                        <option value="2" selected class="dark:bg-slate-800">2 Jobs</option>
                        <option value="5" class="dark:bg-slate-800">5 Jobs</option>
                    </select>
                </div>

                <!-- Job History Button -->
                <a href="/history" class="text-gray-400 hover:text-blue-600 transition p-2" title="Job History">
                    <i class="fas fa-history text-lg"></i>
                </a>

                <a href="/configuration" class="text-gray-400 hover:text-blue-600 transition p-2" title="Settings">
                    <i class="fas fa-cog text-lg"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="flex-grow flex overflow-hidden relative">
        <div class="w-full h-full overflow-y-auto p-6 bg-slate-50 dark:bg-slate-900">
            <div class="max-w-6xl mx-auto flex flex-col items-center">

                <!-- Add Job Card -->
                <div
                    class="w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-300 dark:border-slate-600 p-6 mb-8 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-600"></div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-gray-800 dark:text-gray-100 text-lg flex items-center gap-2">
                            <div
                                class="w-8 h-8 rounded-full bg-blue-50 dark:bg-slate-700 flex items-center justify-center text-blue-600 dark:text-blue-400">
                                <i class="fas fa-plus"></i>
                            </div>
                            New Job Description
                        </h2>
                        <span
                            class="text-xs bg-green-50 text-green-700 border border-green-100 px-2 py-1 rounded-full font-bold flex items-center gap-1.5">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                            Auto-Process Active
                        </span>
                    </div>

                    <textarea id="jdInput"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg p-4 h-32 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition text-sm font-mono text-gray-600 dark:text-gray-300 placeholder-gray-400 resize-none"
                        placeholder="Paste job description text here..."></textarea>

                    <div class="flex justify-end mt-4">
                        <button onclick="addToQueue()"
                            class="bg-slate-900 hover:bg-black dark:bg-blue-600 dark:hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium text-sm shadow-md transition-all flex items-center gap-2 transform active:scale-95">
                            <span>Add to Queue</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Queue Stats -->
                <div class="w-3/4 flex items-center gap-3 mb-4 px-1 self-center">
                    <h2 class="font-bold text-xl text-gray-800 dark:text-white">Job Activity</h2>
                    <span id="activeCount"
                        class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
                </div>

                <!-- Job List -->
                <div id="jobList" class="w-3/4 space-y-4 pb-20">
                    <div
                        class="text-center py-12 border-2 border-dashed border-gray-300 dark:border-slate-700 rounded-xl opacity-60">
                        <p class="text-gray-500 dark:text-gray-400">Queue is empty</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Preview Drawer -->
        <div id="drawerOverlay" onclick="closePreview()"
            class="fixed inset-0 bg-black bg-opacity-30 z-40 hidden transition-opacity duration-300 opacity-0"></div>
        <div id="previewDrawer"
            class="fixed inset-y-0 right-0 w-full md:w-2/3 lg:w-1/2 bg-white dark:bg-slate-800 shadow-2xl z-50 transform translate-x-full drawer flex flex-col border-l border-gray-200 dark:border-slate-700">
            <div
                class="border-b border-gray-200 dark:border-slate-700 p-4 flex justify-between items-center shadow-sm z-10 flex-none bg-white dark:bg-slate-800">
                <div class="flex items-center gap-3">
                    <div
                        class="bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-400 p-2 rounded hidden sm:block">
                        <i class="fas fa-eye text-lg"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h3 class="font-bold text-gray-800 dark:text-white text-sm uppercase tracking-wide">Print
                            Preview</h3>
                        <p id="previewLabel"
                            class="text-xs font-mono text-gray-500 dark:text-gray-400 truncate max-w-[250px]">No file
                            selected</p>
                    </div>
                </div>
                <button onclick="closePreview()"
                    class="text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full p-2 transition"><i
                        class="fas fa-times text-xl"></i></button>
            </div>
            <div class="flex-grow relative bg-slate-100 dark:bg-slate-900 overflow-y-auto overflow-x-hidden flex flex-col items-center"
                id="previewStage">
                <div id="emptyState" class="flex flex-col items-center justify-center h-full text-gray-400"><i
                        class="fas fa-file-pdf text-4xl mb-4 opacity-50"></i>
                    <p class="text-sm font-medium">Select "Preview HTML" on a job to view</p>
                </div>
                <div id="loadingSpinner" class="hidden flex-col items-center justify-center h-full mt-20"><i
                        class="fas fa-spinner fa-spin text-4xl text-blue-400 mb-3"></i>
                    <p class="text-gray-600 text-sm font-medium">Rendering Pages...</p>
                </div>
                <div id="pdf-canvas-container"></div>
            </div>
        </div>
    </div>

    <!-- REWRITE MODAL -->
    <div id="rewriteModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-lg overflow-hidden">
            <div
                class="p-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-700">
                <h3 class="font-bold text-gray-800 dark:text-white">Rewrite Options</h3>
                <button onclick="closeRewriteModal()" class="text-gray-400 hover:text-red-500"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex gap-3">
                    <button onclick="triggerRewrite('normal')"
                        class="flex-1 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-lg p-4 hover:border-blue-400 transition text-left group shadow-sm">
                        <div class="font-bold text-blue-600 dark:text-blue-400 mb-1"><i
                                class="fas fa-sync-alt mr-2"></i> Retry</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">Re-run with original prompt.</div>
                    </button>
                    <button onclick="showAdvanced()"
                        class="flex-1 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-lg p-4 hover:border-amber-400 transition text-left shadow-sm">
                        <div class="font-bold text-amber-600 dark:text-amber-400 mb-1"><i class="fas fa-magic mr-2"></i>
                            Refine</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">Edit with instructions.</div>
                    </button>
                </div>

                <div id="advancedInput"
                    class="hidden pt-4 border-t border-gray-100 dark:border-slate-700 transition-all">
                    <div class="mb-3">
                        <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase mb-2 tracking-wide">Quick
                            Suggestions</p>
                        <div class="flex flex-wrap gap-2">
                            <button
                                onclick="appendPrompt('Make the professional summary bigger, add more points related to the JD relatability')"
                                class="px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100 hover:bg-indigo-100 dark:bg-slate-700 dark:text-indigo-300 dark:border-slate-600 dark:hover:bg-slate-600 transition cursor-pointer"><i
                                    class="fas fa-user-tie mr-1"></i> Enhance Summary</button>
                            <button onclick="appendPrompt('Add more experience points')"
                                class="px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-100 hover:bg-emerald-100 dark:bg-slate-700 dark:text-emerald-300 dark:border-slate-600 dark:hover:bg-slate-600 transition cursor-pointer"><i
                                    class="fas fa-briefcase mr-1"></i> More Experience</button>
                            <button onclick="appendPrompt('Add more technical skills')"
                                class="px-3 py-1.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-100 hover:bg-amber-100 dark:bg-slate-700 dark:text-amber-300 dark:border-slate-600 dark:hover:bg-slate-600 transition cursor-pointer"><i
                                    class="fas fa-code mr-1"></i> Add Skills</button>

                            <!-- NEW SUGGESTIONS -->
                            <button onclick="appendPrompt('Reduce content by 5-10% without compromising quality')"
                                class="px-3 py-1.5 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-100 hover:bg-rose-100 dark:bg-slate-700 dark:text-rose-300 dark:border-slate-600 dark:hover:bg-slate-600 transition cursor-pointer"><i
                                    class="fas fa-compress-alt mr-1"></i> Shorten Content</button>
                            <button
                                onclick="appendPrompt('Add more projects to specific Jobs to highlight more Job relatability')"
                                class="px-3 py-1.5 rounded-full text-xs font-medium bg-cyan-50 text-cyan-700 border border-cyan-100 hover:bg-cyan-100 dark:bg-slate-700 dark:text-cyan-300 dark:border-slate-600 dark:hover:bg-slate-600 transition cursor-pointer"><i
                                    class="fas fa-project-diagram mr-1"></i> Add Projects</button>
                        </div>
                    </div>
                    <textarea id="rewriteInstructions"
                        class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-lg p-3 text-sm h-24 outline-none dark:text-white focus:ring-2 focus:ring-blue-500 mb-3 resize-none transition"
                        placeholder="e.g., Add 'Python' to skills, remove project X..."></textarea>
                    <button onclick="triggerRewrite('advanced')"
                        class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-lg font-bold transition shadow-sm flex justify-center items-center gap-2"><i
                            class="fas fa-wand-magic-sparkles"></i> Advanced Rewrite</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chatModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div
            class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-lg h-[600px] flex flex-col overflow-hidden">
            <div
                class="p-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                <div class="flex items-center gap-2"><i class="fas fa-robot"></i>
                    <h3 class="font-bold text-sm">Ask LLM Assistant</h3>
                </div><button onclick="closeChatModal()" class="text-white opacity-80 hover:opacity-100"><i
                        class="fas fa-times"></i></button>
            </div>
            <div id="chatMessages" class="flex-grow bg-gray-50 dark:bg-slate-900 p-4 overflow-y-auto flex flex-col">
                <div class="text-center text-gray-400 text-xs mt-4 mb-4">
                    <p>Ask questions about this job.</p>
                </div>
            </div>
            <div class="p-4 bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700">
                <div class="flex gap-2"><textarea id="chatInput"
                        class="flex-grow bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-lg p-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none resize-none h-12 dark:text-white"
                        placeholder="Type question..."></textarea><button onclick="sendChatMessage()" id="chatSendBtn"
                        class="bg-purple-600 hover:bg-purple-700 text-white px-4 rounded-lg font-medium transition"><i
                            class="fas fa-paper-plane"></i></button></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
    <script>
        // --- THEME LOGIC ---
        window.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) { icon.className = 'fas fa-sun'; }
            else { icon.className = 'fas fa-moon'; }
        });

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                icon.className = 'fas fa-moon';
            } else {
                html.classList.add('dark');
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                icon.className = 'fas fa-sun';
            }
        }

        // --- PROMPT LOGIC ---
        function appendPrompt(text) {
            const input = document.getElementById('rewriteInstructions');
            const currentVal = input.value.trim();
            if (currentVal.length > 0) {
                // Add comma if text exists
                input.value = currentVal + ", " + text;
            } else {
                input.value = text;
            }
            // Flash highlight to indicate addition
            input.classList.add('ring-2', 'ring-green-400');
            setTimeout(() => input.classList.remove('ring-2', 'ring-green-400'), 200);
            input.focus();
        }
    </script>
</body>

</html>
